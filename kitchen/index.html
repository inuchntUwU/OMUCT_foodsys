<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eat it -キッチン</title>
    <link rel="icon" href="../home/eat it.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>
</head>
<script type="module">
  import { watchAuthState } from "../auth.js"; // パスは階層に応じて調整してください
  watchAuthState(
    (user, idToken) => { /* ログイン中はそのままページを表示 */ },
    () => { window.location.href = "../login.html"; } // 未ログインならログインへ強制移動
  );
</script>
<body>
    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <img src="../home/eat it.png" alt="EAT IT" class="logo-img">
            </div>
            <div class="back-to-home">
                <a href="../home/index.html" class="home-back-btn">🏠 ホームに戻る</a>
            </div>
        </div>
    </header>
    
    <main class="main-container">
        <div class="title">今ある食材一覧</div>
        
        <select id="sort-select" class="sort-dropdown">
          <option value="created">最新</option>
          <option value="name">名前</option>
          <option value="expiration">賞味期限</option>
        </select>
        
        <section class="food-list">
            <ul id="food-container" class="food-grid"></ul>
        </section>
    </main>
</body>
<footer class="footer">
  <p>&copy; 2026 Foodsystem. All rights reserved.</p>
</footer>
</html>
